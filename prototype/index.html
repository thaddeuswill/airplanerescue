<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Airplane Rescue</title>
<style>
  :root { --bg:#eef2f5; --card:#fff; --ink:#1d2a35; --muted:#5d6b78; --land:#dfe8d3; --edge:#93a58a; --accent:#d9480f; --ok:#2b8a3e; --line:#c9d2da; --depot:#1c6dd0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#10161c; --card:#1a232c; --ink:#e3e9ee; --muted:#93a1ad; --land:#22301f; --edge:#4f6648; --accent:#ff7a3d; --ok:#5cc96f; --line:#2c3843; --depot:#5aa2ff; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; flex-wrap:wrap; gap:8px 20px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); }
  h1 { font-size:20px; margin:0; }
  #stats { display:flex; gap:16px; flex-wrap:wrap; color:var(--muted); }
  #stats b { color:var(--ink); }
  main { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:16px; padding:16px; }
  @media (max-width:820px) { main { grid-template-columns:1fr; } }
  #map { width:100%; height:auto; background:var(--card); border-radius:10px; border:1px solid var(--line); }
  #map .city { cursor:pointer; }
  #map text { font-size:10px; fill:var(--muted); pointer-events:none; }
  aside { display:flex; flex-direction:column; gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .card h2 { font-size:15px; margin:0 0 8px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:4px 0; }
  .muted { color:var(--muted); font-size:13px; }
  .ok { color:var(--ok); }
  button { font:inherit; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #log { padding:0 16px 16px; color:var(--muted); font-size:13px; }
  dialog { border:none; border-radius:12px; padding:20px; width:min(420px,92vw); background:var(--card); color:var(--ink); }
  dialog::backdrop { background:#0008; }
  #bar { position:relative; height:28px; background:var(--bg); border:1px solid var(--line); border-radius:6px; margin:14px 0; overflow:hidden; }
  #zone { position:absolute; top:0; bottom:0; background:var(--ok); opacity:.55; }
  #needle { position:absolute; top:-2px; bottom:-2px; width:4px; margin-left:-2px; background:var(--accent); }
</style>
</head>
<body>
<header><h1>✈ Airplane Rescue</h1><div id="stats"></div></header>
<main>
  <svg id="map" viewBox="0 0 780 430" role="img" aria-label="Map of the country"></svg>
  <aside id="panel"></aside>
</main>
<div id="log"></div>

<dialog id="mini">
  <h2 id="mgTitle" style="margin:0;font-size:17px"></h2>
  <div id="bar"><div id="zone"></div><div id="needle"></div></div>
  <p id="mgMsg" class="muted"></p>
  <button id="wrench" class="primary" autofocus>🔧 Tighten! (Space)</button>
</dialog>

<script>
// [name, lon, lat, has parts depot]
const CITIES = [
  ['Seattle',-122.3,47.6,1],['Portland',-122.7,45.5],['San Francisco',-122.4,37.8],['Los Angeles',-118.2,34.1,1],
  ['Las Vegas',-115.1,36.2],['Phoenix',-112.1,33.4],['Boise',-116.2,43.6],['Salt Lake City',-111.9,40.8],
  ['Billings',-108.5,45.8],['Denver',-105,39.7,1],['Albuquerque',-106.6,35.1],['Fargo',-96.8,46.9],
  ['Omaha',-96,41.3],['Wichita',-97.3,37.7,1],['Oklahoma City',-97.5,35.5],['Dallas',-96.8,32.8,1],
  ['Houston',-95.4,29.8],['Minneapolis',-93.3,45],['Chicago',-87.6,41.9,1],['St. Louis',-90.2,38.6],
  ['Memphis',-90,35.1],['New Orleans',-90.1,30],['Nashville',-86.8,36.2],['Atlanta',-84.4,33.7,1],
  ['Orlando',-81.4,28.5],['Miami',-80.2,25.8],['Charlotte',-80.8,35.2],['Detroit',-83,42.3],
  ['Pittsburgh',-80,40.4],['Washington',-77,38.9],['New York',-74,40.7,1],['Boston',-71.1,42.4],['Bangor',-68.8,44.8],
].map(([name,lon,lat,depot]) => ({name,lon,lat,depot:!!depot}));
const city = n => CITIES.find(c => c.name === n);

const OUTLINE = [[-124.7,48.4],[-123,48.2],[-122.8,49],[-95.2,49],[-94.8,49.4],[-89.6,48],[-84.8,46.5],[-82.5,45.3],[-82.4,43],[-79,43.3],[-76.3,44.2],[-74.9,45],[-71.5,45],[-70,46.7],[-69.2,47.4],[-67.8,47.1],[-67.8,45.6],[-67,44.8],[-70.2,43.6],[-70.6,42.7],[-70,41.8],[-71.8,41.3],[-74,40.6],[-75,38.9],[-75.9,37.1],[-75.5,35.2],[-77,34.6],[-78.9,33.6],[-80.8,32.1],[-81.4,30.7],[-80.1,26.9],[-80.4,25.2],[-81.2,25.2],[-81.8,26.4],[-82.7,28],[-82.8,29.5],[-84,30.1],[-85.4,29.7],[-86.5,30.4],[-89.6,30.2],[-89.4,29],[-90.3,29.1],[-91.8,29.5],[-93.8,29.7],[-94.7,29.4],[-96.6,28.1],[-97.4,26.4],[-97.2,25.9],[-99.1,26.4],[-100.5,28.6],[-101.4,29.8],[-102.7,29.7],[-103.3,29],[-104.5,29.6],[-106.5,31.8],[-108.2,31.8],[-108.2,31.3],[-111,31.3],[-114.8,32.5],[-117.1,32.5],[-118.5,34],[-120.6,34.6],[-121.9,36.6],[-122.5,37.8],[-123.7,39],[-124.4,40.4],[-124.2,42],[-124,46.3]];
const proj = (lon, lat) => [(lon + 125.5) * 13, (49.8 - lat) * 16 + 8];

const FAULTS = [
  {name:'Flat main tire', part:'Tire & tube', cost:180, diff:1},
  {name:'Dead battery', part:'Battery', cost:350, diff:1},
  {name:'Fouled spark plugs', part:'Spark plug set', cost:220, diff:1},
  {name:'Oil leak', part:'Gasket kit', cost:150, diff:1},
  {name:'Worn brakes', part:'Brake pads', cost:260, diff:1},
  {name:'Bird nest in the cowling', part:null, cost:0, diff:1},
  {name:'Leaking fuel line', part:'Fuel line kit', cost:300, diff:2},
  {name:'Cracked windshield', part:'Windshield', cost:900, diff:2},
  {name:'Seized starter', part:'Starter motor', cost:1100, diff:2},
  {name:'Frayed control cables', part:'Control cable set', cost:650, diff:2},
  {name:'Bad magneto', part:'Magneto', cost:1400, diff:3},
  {name:'Dead radio & transponder', part:'Avionics unit', cost:1800, diff:3},
  {name:'Bent propeller', part:'Propeller', cost:2600, diff:3},
];
const PARTS = FAULTS.filter(f => f.part);
const TYPES = [['High-wing trainer',1500],['Rag-wing taildragger',2000],['Low-wing tourer',2200],['Bush plane',2500],['Vintage biplane',3000],['Amphibian',3200],['Light twin',3800]];
const BASE = 'Wichita', GOAL = 10, MAX_JOBS = 4, FUEL_PER_MILE = 0.9, MILES_PER_DAY = 900;

function miles(a, b) {
  const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r) * Math.cos(b.lat*r) * Math.sin(dLon/2)**2;
  return 2 * 3959 * Math.asin(Math.sqrt(h));
}
console.assert(Math.abs(miles(city('New York'), city('Los Angeles')) - 2450) < 60, 'miles() is off');
const trip = (from, to) => { const d = miles(city(from), city(to)); return {d: Math.round(d), cost: Math.round(d * FUEL_PER_MILE), days: Math.max(0.25, d / MILES_PER_DAY)}; };
const rand = n => Math.floor(Math.random() * n);
const money = n => '$' + n.toLocaleString();

let S;
function newGame() {
  S = {cash:3000, day:1, at:BASE, inv:{}, jobs:[], rescued:0, selected:null, over:null, log:[], nextId:1};
  advance(0);
  log(`Welcome to ${BASE}. Stranded planes are waiting. Rescue ${GOAL} to win!`);
  render();
}

function spawnJob() {
  const taken = new Set(S.jobs.map(j => j.city));
  const options = CITIES.filter(c => c.name !== S.at && !taken.has(c.name));
  const [name, base] = TYPES[rand(TYPES.length)];
  const pool = [...FAULTS], faults = [];
  for (let n = 1 + rand(Math.min(4, 2 + Math.floor(S.rescued / 3))); n > 0; n--) faults.push({...pool.splice(rand(pool.length), 1)[0], fixed:false});
  const reward = Math.round((base + faults.reduce((s, f) => s + f.cost, 0) * 1.6) / 50) * 50;
  S.jobs.push({id:S.nextId++, city:options[rand(options.length)].name, type:name, faults, reward, inspected:false, deadline:S.day + 7 + rand(10)});
}

function advance(days) {
  S.day += days;
  for (const j of [...S.jobs]) if (S.day > j.deadline) {
    S.jobs.splice(S.jobs.indexOf(j), 1);
    log(`⌛ The owner in ${j.city} gave up and scrapped the ${j.type}.`);
  }
  while (S.jobs.length < MAX_JOBS) spawnJob();
}

const jobHere = () => S.jobs.find(j => j.city === S.at);
const log = msg => { S.log.unshift(`Day ${Math.floor(S.day)}: ${msg}`); S.log.length = Math.min(S.log.length, 6); };

function checkStuck() {
  if (S.over) return;
  const cheapest = Math.min(...CITIES.filter(c => c.name !== S.at).map(c => trip(S.at, c.name).cost));
  if (S.cash >= cheapest) return;
  const job = jobHere(), depot = city(S.at).depot;
  const canFinish = job && (!job.inspected || job.faults.every(f => f.fixed || !f.part || S.inv[f.part] > 0 || (depot && S.cash >= f.cost)));
  if (!canFinish) S.over = 'broke';
}

const ACTIONS = {
  select(name) { S.selected = name === S.at ? null : name; render(); },
  fly() {
    const to = S.selected, t = trip(S.at, to);
    if (S.cash < t.cost) return;
    S.cash -= t.cost; S.at = to; S.selected = null;
    advance(t.days);
    log(`Flew ${t.d} mi to ${to} (${money(t.cost)} fuel).`);
    checkStuck(); render();
  },
  inspect() {
    const job = jobHere(); job.inspected = true; advance(0.5);
    log(`Inspected the ${job.type}: ${job.faults.length} problem(s) found.`);
    checkStuck(); render();
  },
  buy(part) {
    const p = PARTS.find(f => f.part === part);
    if (S.cash < p.cost) return;
    S.cash -= p.cost; S.inv[part] = (S.inv[part] || 0) + 1; render();
  },
  repair(i) { startRepair(+i); },
  deliver() {
    const job = jobHere();
    S.cash += job.reward; S.rescued++;
    S.jobs.splice(S.jobs.indexOf(job), 1);
    log(`🛫 The ${job.type} is airworthy! Owner paid ${money(job.reward)}.`);
    if (S.rescued >= GOAL) S.over = 'won';
    advance(0); render();
  },
  restart: newGame,
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b) e.preventDefault();
  if (b && !b.disabled && !S.over || b?.dataset.act === 'restart') ACTIONS[b.dataset.act](b.dataset.arg);
});

// --- repair minigame: stop the needle inside the green zone ---
const dlg = document.getElementById('mini'), zone = document.getElementById('zone'), needle = document.getElementById('needle');
let mg = null;
function startRepair(i) {
  const f = jobHere().faults[i], zw = 34 - f.diff * 8, zl = 5 + Math.random() * (90 - zw);
  zone.style.left = zl + '%'; zone.style.width = zw + '%';
  document.getElementById('mgTitle').textContent = `Repair: ${f.name}`;
  document.getElementById('mgMsg').textContent = 'Hit the wrench when the needle is in the green.';
  mg = {i, zl, zw, pos:0, dir:1, speed:55 + f.diff * 40, last:performance.now(), done:false};
  dlg.showModal(); requestAnimationFrame(tick);
}
function tick(t) {
  if (!mg || mg.done) return;
  mg.pos += mg.dir * mg.speed * (t - mg.last) / 1000; mg.last = t;
  if (mg.pos > 100) { mg.pos = 200 - mg.pos; mg.dir = -1; }
  if (mg.pos < 0) { mg.pos = -mg.pos; mg.dir = 1; }
  needle.style.left = mg.pos + '%';
  requestAnimationFrame(tick);
}
document.getElementById('wrench').onclick = () => {
  if (!mg || mg.done) return;
  mg.done = true;
  const job = jobHere(), f = job.faults[mg.i], hit = mg.pos >= mg.zl && mg.pos <= mg.zl + mg.zw;
  let msg;
  if (hit) {
    f.fixed = true; if (f.part) S.inv[f.part]--;
    msg = '✅ Fixed!'; log(`Fixed: ${f.name} on the ${job.type}.`);
  } else if (f.part && Math.random() < f.diff * 0.15) {
    S.inv[f.part]--; msg = `💥 Slipped — the ${f.part} is ruined.`; log(`Ruined a ${f.part}.`);
  } else msg = '😬 Slipped! Try again.';
  document.getElementById('mgMsg').textContent = msg;
  advance(0.25); checkStuck();
  setTimeout(() => dlg.close(), 900);
};
dlg.addEventListener('close', () => { mg = null; render(); });

// --- rendering ---
function render() {
  const here = city(S.at), job = jobHere();
  document.getElementById('stats').innerHTML =
    `<span>💵 <b>${money(S.cash)}</b></span><span>📅 Day <b>${Math.floor(S.day)}</b></span><span>🛩 Rescued <b>${S.rescued}/${GOAL}</b></span>`;

  // map
  const pt = c => proj(c.lon, c.lat);
  let svg = `<path d="M${OUTLINE.map(p => proj(...p).join(',')).join('L')}Z" fill="var(--land)" stroke="var(--edge)" stroke-width="1.5"/>`;
  if (S.selected) { const [x1,y1] = pt(here), [x2,y2] = pt(city(S.selected)); svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--accent)" stroke-dasharray="5 4" stroke-width="2"/>`; }
  for (const c of CITIES) {
    const [x,y] = pt(c), j = S.jobs.find(j => j.city === c.name), sel = c.name === S.selected;
    svg += `<g class="city" data-act="select" data-arg="${c.name}"><title>${c.name}${c.depot ? ' (parts depot)' : ''}</title>
      <circle cx="${x}" cy="${y}" r="12" fill="transparent"/>
      ${c.depot ? `<rect x="${x-5}" y="${y-5}" width="10" height="10" fill="var(--depot)"/>` : `<circle cx="${x}" cy="${y}" r="4" fill="var(--muted)"/>`}
      ${sel ? `<circle cx="${x}" cy="${y}" r="9" fill="none" stroke="var(--accent)" stroke-width="2"/>` : ''}
      ${j ? `<text x="${x+5}" y="${y-5}" style="font-size:16px;fill:var(--accent)">✈</text>` : ''}
      ${c.depot || j || sel || c.name === S.at ? `<text x="${x}" y="${y+16}" text-anchor="middle">${c.name}</text>` : ''}</g>`;
  }
  const [px,py] = pt(here);
  svg += `<circle cx="${px}" cy="${py}" r="11" fill="none" stroke="var(--ok)" stroke-width="3" pointer-events="none"/>`;
  document.getElementById('map').innerHTML = svg;

  // side panel
  let h = '';
  if (S.over) h += `<div class="card"><h2>${S.over === 'won' ? `🏆 You rescued ${GOAL} planes in ${Math.floor(S.day)} days!` : '💸 Out of money and stuck on the ground. Game over.'}</h2><button class="primary" data-act="restart">Play again</button></div>`;

  h += `<div class="card"><h2>📍 ${S.at}${here.depot ? ' · parts depot' : ''}</h2>`;
  if (job) {
    const days = Math.ceil(job.deadline - S.day);
    h += `<div class="row"><b>${job.type}</b><span class="muted">${days}d left · pays ${money(job.reward)}</span></div>`;
    if (!job.inspected) h += `<button class="primary" data-act="inspect">Inspect plane (½ day)</button>`;
    else {
      job.faults.forEach((f, i) => {
        const have = f.part ? S.inv[f.part] || 0 : Infinity;
        h += `<div class="row"><span>${f.fixed ? '✅' : '⚠️'} ${f.name}<br><span class="muted">${f.part ? `Needs ${f.part} (have ${have})` : 'No part needed'} · ${'🔧'.repeat(f.diff)}</span></span>
          ${f.fixed ? '<span class="ok">Done</span>' : `<button data-act="repair" data-arg="${i}" ${have > 0 ? '' : 'disabled'}>Repair</button>`}</div>`;
      });
      if (job.faults.every(f => f.fixed)) h += `<button class="primary" data-act="deliver">Test flight & sign off (+${money(job.reward)})</button>`;
    }
  } else h += `<p class="muted">No stranded plane here.</p>`;
  h += `</div>`;

  if (here.depot) {
    h += `<div class="card"><h2>🛒 Parts depot</h2>`;
    for (const p of PARTS) h += `<div class="row"><span>${p.part} <span class="muted">(have ${S.inv[p.part] || 0})</span></span><button data-act="buy" data-arg="${p.part}" ${S.cash < p.cost ? 'disabled' : ''}>${money(p.cost)}</button></div>`;
    h += `</div>`;
  }

  if (S.selected) {
    const t = trip(S.at, S.selected), sj = S.jobs.find(j => j.city === S.selected);
    h += `<div class="card"><h2>🧭 ${S.selected}${city(S.selected).depot ? ' · parts depot' : ''}</h2>
      <p class="muted">${t.d} mi · ${money(t.cost)} fuel · ${t.days.toFixed(1)} days${sj ? `<br>Stranded: ${sj.type} (${Math.ceil(sj.deadline - S.day)}d left)` : ''}</p>
      <button class="primary" data-act="fly" ${S.cash < t.cost ? 'disabled' : ''}>Fly there</button></div>`;
  }

  h += `<div class="card"><h2>📻 Rescue calls</h2>`;
  for (const j of [...S.jobs].sort((a, b) => a.deadline - b.deadline))
    h += `<div class="row"><a href="#" data-act="select" data-arg="${j.city}">${j.city}</a><span class="muted">${j.type} · ${Math.ceil(j.deadline - S.day)}d left</span></div>`;
  const inv = Object.entries(S.inv).filter(([, n]) => n > 0).map(([p, n]) => `${p} ×${n}`).join(', ');
  h += `<p class="muted">🧰 Toolbox: ${inv || 'empty'}</p></div>`;

  document.getElementById('panel').innerHTML = h;
  document.getElementById('log').innerHTML = S.log.join('<br>');
}

newGame();
</script>
</body>
</html>
